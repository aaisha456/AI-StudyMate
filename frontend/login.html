<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AI StudyMate</title>

    <!-- Main website stylesheet -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

    <!-- =========================================
         LOGIN PAGE
         ========================================= -->

    <main class="auth-page">

        <section class="auth-container">

            <!-- Logo / Website Name -->
            <div class="auth-header">

                <h1>
                    AI StudyMate
                </h1>

                <p>
                    Learn • Understand • Practice • Improve
                </p>

            </div>


            <!-- Login Box -->
            <div class="auth-card">

                <h2>
                    Welcome Back
                </h2>

                <p class="auth-description">
                    Login to continue your learning journey.
                </p>


                <!-- Login Form -->
                <form
                    id="loginForm"
                    method="POST"
                >

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                  <!-- Password -->
<div class="form-group">

    <label for="password">
        Password
    </label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="Show password"
        >
            👁
        </button>

    </div>

</div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="primary-button auth-button"
                    >
                        Login
                    </button>

                </form>


                <!-- Register Link -->
                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>


                <!-- Back to Home -->
                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>

<script src="js/login.js"></script>
</body>

</html>
