<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI StudyMate</title>

    <!-- Main website stylesheet -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Authentication page stylesheet -->
    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

    <!-- =========================================
         REGISTRATION PAGE
         ========================================= -->

    <main class="auth-page">

        <section class="auth-container">

            <!-- Logo / Website Name -->
            <div class="auth-header">

                <h1>
                    AI StudyMate
                </h1>

                <p>
                    Learn • Understand • Practice • Improve
                </p>

            </div>


            <!-- Registration Box -->
            <div class="auth-card">

                <h2>
                    Create Your Account
                </h2>

                <p class="auth-description">
                    Create an account to start your personalized learning journey.
                </p>


                <!-- Registration Form -->
                <form
                    id="registerForm"
                    method="POST"
                >

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                  <!-- Password -->
<div class="form-group">

    <label for="password">
        Password
    </label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button
            type="button"
            class="password-toggle"
            id="toggleRegisterPassword"
            aria-label="Show password"
        >
            👁
        </button>

    </div>

</div>

                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="primary-button auth-button"
                    >
                        Create Account
                    </button>

                </form>


                <!-- Login Link -->
                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>


                <!-- Back to Home -->
                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>

<script src="js/register.js"></script>
</body>

</html>
